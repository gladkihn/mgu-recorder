name: Store packages
on:
  workflow_dispatch:
    inputs:
      rebuild_runtime:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source twice
        run: |
          python3 build/test.py
          python3 build/test.py
      - name: Restore unchanged published runtime
        if: ${{ !inputs.rebuild_runtime }}
        run: python3 build/restore_runtime.py
      - name: Build for MGU glibc 2.17
        run: |
          docker pull quay.io/pypa/manylinux2014_x86_64:latest
          mkdir -p dist
          docker image inspect quay.io/pypa/manylinux2014_x86_64:latest --format '{{index .RepoDigests 0}}' > dist/build-image.txt
          if [ '${{ inputs.rebuild_runtime }}' = 'true' ]; then script=build/ffmpeg.sh; else script=build/native.sh; fi
          docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux2014_x86_64:latest bash "$script"
          sudo chown -R "$(id -u):$(id -g)" recorder/native recorder/runtime dist
      - name: Normalize MGU ELF loader and verify target filesystem
        run: |
          python3 build/retarget_elf.py
          if [ ! -e /lib/ld-linux-x86-64.so.2 ]; then sudo ln -s "$(readlink -f /lib64/ld-linux-x86-64.so.2)" /lib/ld-linux-x86-64.so.2; fi
          python3 build/verify_target_layout.py
      - name: Verify codec
        run: |
          python3 build/verify_runtime.py
      - name: Verify native NV shared memory and flow control
        run: sudo python3 build/verify_nv.py
      - name: Build Store artifacts
        run: |
          python3 build/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mgu-store
          path: dist/*
          retention-days: 7
