name: Store packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build for MGU glibc 2.17
        run: |
          docker pull quay.io/pypa/manylinux2014_x86_64:latest
          mkdir -p dist
          docker image inspect quay.io/pypa/manylinux2014_x86_64:latest --format '{{index .RepoDigests 0}}' > dist/build-image.txt
          docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux2014_x86_64:latest bash build/ffmpeg.sh
      - name: Verify codec and build Store artifacts
        run: |
          python3 build/verify_runtime.py
          python3 build/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mgu-store
          path: dist/*
          retention-days: 7
